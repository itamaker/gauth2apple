name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-universal2
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install zbar for both archs and fuse a universal dylib (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          # arm64 zbar from /opt/homebrew (native brew on macos-latest)
          brew install zbar

          # x86_64 zbar from /usr/local Homebrew (preinstalled on macos-latest under Rosetta)
          arch -x86_64 /usr/local/bin/brew install zbar

          ARM_LIB="$(brew --prefix zbar)/lib/libzbar.0.dylib"
          INTEL_LIB="$(arch -x86_64 /usr/local/bin/brew --prefix zbar)/lib/libzbar.0.dylib"

          # Sanity: confirm the two dylibs are single-arch as expected
          lipo -info "$ARM_LIB"
          lipo -info "$INTEL_LIB"

          # Fuse into a universal dylib and replace the arm64 one in place
          sudo lipo -create "$ARM_LIB" "$INTEL_LIB" -output "$ARM_LIB"
          lipo -info "$ARM_LIB"

      - name: Install zbar + tkinter (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build universal2 .app (macOS)
        if: runner.os == 'macOS'
        run: |
          ARM_LIB="$(brew --prefix zbar)/lib/libzbar.0.dylib"
          pyinstaller \
            --windowed \
            --name gauth2apple \
            --target-arch universal2 \
            --collect-all pyzbar \
            --add-binary "$ARM_LIB:." \
            gauth2apple_gui.py

      - name: Build binary (Linux / Windows)
        if: runner.os != 'macOS'
        run: pyinstaller --onefile --windowed --name gauth2apple --collect-all pyzbar gauth2apple_gui.py

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          cd dist
          zip -r ../release/gauth2apple-${{ matrix.target }}.zip gauth2apple.app

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          cp dist/gauth2apple release/gauth2apple-${{ matrix.target }}
          chmod +x release/gauth2apple-${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p release
          cp dist/gauth2apple.exe release/gauth2apple-${{ matrix.target }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: gauth2apple-${{ matrix.target }}
          path: release/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
